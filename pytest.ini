# filepath: pytest.ini
[pytest]
addopts = --cache-clear
          --strict-markers
          --gherkin-terminal-reporter
          --alluredir allure-results
          --clean-alluredir
          -v -s
          ; -p no:warnings
bdd_features_base_dir = qa_automation/tests/ui/features
testpaths = qa_automation/tests/ui/step_definitions
console_output_style = classic
filterwarnings =
    ignore::DeprecationWarning
    ignore::RuntimeWarning
    ignore::RuntimeWarning:.*coroutine.*
    ignore::RuntimeWarning:.*sys*.
    ignore::RuntimeWarning:.*Enable tracemalloc*.
log_cli = true
log_cli_level = INFO
markers = 
    # Common markers
    smoke: Run only smoke tests
    regression: Run only regression tests
    ada_home: Reference ADA home page scenario
    positive: Run only positive tests
    negative: Run only negative tests
    page_sub_links: Run only page_sub_links tests
    sub_page_breadcrumbs: Run only sub_page_breadcrumbs tests
    page_back_to_workbench: Run only page_back_to_workbench tests
    page_next_button_page_navigations: Run only page_next_button_page_navigations tests
    page_back_button_page_navigations: Run only page_back_button_page_navigations tests
python_files = test_*.py *_test.py *_steps.py
    